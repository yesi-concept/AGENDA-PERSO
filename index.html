<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<title>Y.E.S.I — Suivi Pro</title>
<style>
:root{--bg:#0e0d0b;--card:#17150f;--card2:#1f1c14;--line:#2e2a1e;--gold:#c9a24a;--gold2:#e6c878;--txt:#efe4cc;--mut:#9c927c;--ok:#6fbf73;--warn:#e0a63a;--bad:#d9634c;--blue:#7aa7d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:rgba(14,13,11,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
.brand{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto}
.brand h1{margin:0;font-size:17px;letter-spacing:.5px;color:var(--gold2)}
.brand small{color:var(--mut);font-size:12px}
main{padding:14px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#12110d;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button span{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--gold2)}
nav button.on span{filter:none;opacity:1}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1a1408;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:6}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin:22px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t{font-weight:600}
.m{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--gold2)}
.stat span{font-size:12px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.b-ok{color:var(--ok);border-color:rgba(111,191,115,.4)}
.b-warn{color:var(--warn);border-color:rgba(224,166,58,.45)}
.b-bad{color:var(--bad);border-color:rgba(217,99,76,.45)}
.b-gold{color:var(--gold2);border-color:rgba(201,162,74,.5)}
.b-blue{color:var(--blue);border-color:rgba(122,167,217,.45)}
.alert{border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:16px;border:1px dashed var(--line);border-radius:14px;margin-bottom:10px}
input,select,textarea{width:100%;min-width:0;background:#0b0a08;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=date],input[type=time]{min-height:44px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600}
.btn.gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:8px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 6px;border-radius:8px;font:inherit;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--gold2)}
.bar{height:6px;background:#0b0a08;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#14120d;border-top:1px solid var(--gold);border-radius:18px 18px 0 0;z-index:21;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none;max-width:760px;margin:0 auto}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:4px auto 12px}
.sheet h3{margin:0 0 4px;color:var(--gold2);font-size:18px}
.open{display:block}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .card{position:relative}
.tl .card:before{content:"";position:absolute;left:-22px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.note{white-space:pre-wrap;background:#0b0a08;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.note b{color:var(--gold);font-size:11px;letter-spacing:.8px;display:block;margin-bottom:2px}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.axes div{background:#0b0a08;border-radius:10px;padding:8px 2px}
.axes b{display:block;color:var(--gold2);font-size:18px}
.axes span{font-size:10px;color:var(--mut)}
.pay{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border:0}
.pay input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--gold);color:#1a1408;padding:10px 16px;border-radius:20px;font-weight:600;z-index:30;display:none;white-space:nowrap}
.back{background:none;border:0;color:var(--gold2);font:inherit;padding:0 0 10px}
a{color:var(--gold2);text-decoration:none}
.hello{background:linear-gradient(135deg,#221d10,#17150f);border:1px solid rgba(201,162,74,.4)}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.lk{width:100%;max-width:300px;text-align:center}
.lk-logo{color:var(--gold2);font-weight:800;letter-spacing:3px;font-size:22px}
#lockMsg{color:var(--txt);font-size:15px;margin-bottom:18px;min-height:22px}
.dots{display:flex;justify-content:center;gap:16px;margin-bottom:28px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}
.dots i.on{background:var(--gold)}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:60px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:22px}
.pad button:active{background:var(--card2)}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;margin-top:18px;padding:8px 12px}
body.locked header,body.locked main,body.locked nav,body.locked .fab,body.locked .sheet{visibility:hidden}
.wday{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.wday.today{border-color:var(--gold)}
.wd-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;color:var(--mut);font-size:13px}
.wd-h b{color:var(--txt);font-size:15px;margin-left:2px}
.wday.today .wd-h b{color:var(--gold2)}
.wrdv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.wrdv>b{color:var(--gold2);font-size:14px;width:44px;flex:none}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<header><div class="brand"><div><h1>Y.E.S.I — Suivi Pro</h1><small>Bénéficiaires · RDV · Contrats · v6</small></div><small id="hdate"></small></div></header>
<main id="main"></main>
<button class="fab" id="fab" onclick="fab()">+</button>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>Accueil</button>
<button data-t="benef" onclick="go('benef')"><span>👤</span>Bénéf.</button>
<button data-t="rdv" onclick="go('rdv')"><span>📅</span>RDV</button>
<button data-t="contrats" onclick="go('contrats')"><span>📄</span>Contrats</button>
<button data-t="plus" onclick="go('plus')"><span>⚙️</span>Plus</button>
</nav>
<div class="sheet-bg" id="sbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="docin" multiple style="display:none">
<div id="lock"><div class="lk"><div class="lk-logo">Y.E.S.I</div><div class="m" style="margin-bottom:24px">Suivi Pro</div><div id="lockMsg"></div><div id="lockDots" class="dots"></div><div class="pad"><button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button><button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button><button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button><span></span><button onclick="pinKey('0')">0</button><button onclick="pinKey('del')">⌫</button></div><button class="lnk" id="lockCancel" onclick="lockCancel()">Annuler</button><button class="lnk" id="lockForgot" onclick="pinForgot()">Code oublié ?</button></div></div>

<script>
const KEY='yesi_suivi_pro_v1';
const BSTAT={actif:['Actif','b-ok'],prospect:['Prospect','b-blue'],pause:['En pause','b-warn'],termine:['Terminé','']};
const RSTAT={prevu:['Prévu','b-gold'],fait:['Fait','b-ok'],absent:['Absent','b-bad'],annule:['Annulé','']};
const CSTAT={encours:['En cours','b-ok'],attente:['En attente','b-warn'],termine:['Terminé',''],resilie:['Résilié','b-bad']};
const AXES=[{k:'y',l:'Yes Attitude'},{k:'e',l:'Estime de soi'},{k:'s',l:'Smart Goals'},{k:'i',l:'Investissement'}];
const PROTO3=[{k:'dips',l:'D.I.P.S'},{k:'sota',l:'S.O.T.A'},{k:'qfac',l:'Q.F.A.C'}];
const TYPES=['Bilan Y.E.S.I','Séance de suivi','Séance protocole','Restitution bilan','Point parents','Appel téléphonique','Observation match','Autre'];
const LIEUX=['Présentiel','Visio','Téléphone','Terrain / match','Autre'];
const PROTOS=[['','—'],'D.I.P.S','S.O.T.A','Q.F.A.C','Smart Goals','Diagnostic 4 axes','Diagnostic Performer','Fiche identitaire'];
const OFFRES=[
 {n:'Bilan Mental Y.E.S.I'},
 {n:'Accompagnement Y.E.S.I'},
 {n:'SbSBs — Step by Step BUT Stronger',m:450,s:[250,100,100],mois:3},
 {n:'Bilan Y.E.S.I Club (Collab 2)',m:200,mensuel:true},
 {n:'Diagnostic Y.E.S.I Performer'},
 {n:'Autre'}
];

let db=load();
let state={tab:'home',benef:null,rdvFilter:'semaine',wk:0,benefFilter:'actif',ctrFilter:'encours',q:''};
let _rs='prevu',_ech=[];

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.benef))return{benef:d.benef,contrats:d.contrats||[],rdv:d.rdv||[],settings:d.settings||{},seq:d.seq||0}}catch(e){}return{benef:[],contrats:[],rdv:[],settings:{},seq:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠ Erreur de sauvegarde')}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const rdvDate=r=>new Date(r.date+'T'+(r.heure||'00:00'));
const byDate=(a,b)=>rdvDate(a)-rdvDate(b);
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function fDate(s){if(!s)return'—';const d=new Date(s+'T12:00');if(isNaN(d))return s;return JOURS[d.getDay()]+' '+d.getDate()+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)}
const fRdv=r=>fDate(r.date)+(r.heure?' · '+r.heure.replace(':','h'):'');
const MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function fLong(s){if(!s)return'—';const d=new Date(s+'T12:00');if(isNaN(d))return s;return d.getDate()+(d.getDate()===1?'er':'')+' '+MOISL[d.getMonth()]+' '+d.getFullYear()}
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('fr-FR')+' €';
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+n);return ymd(d)}
const fullName=b=>((b.prenom||'')+' '+(b.nom||'')).trim();
function bName(id){const b=db.benef.find(x=>x.id===id);return b?fullName(b):'(supprimé)'}
const shortOffre=o=>(o||'').split(' — ')[0];
function nextRdv(id){return db.rdv.filter(r=>r.benefId===id&&r.statut==='prevu'&&r.date>=todayStr()).sort(byDate)[0]}
function activeContrat(id){return db.contrats.find(c=>c.benefId===id&&c.statut==='encours')}
function cTotals(c){const ech=c.ech||[];const sum=ech.reduce((s,e)=>s+(+e.montant||0),0);const tot=+c.montant||sum;const paid=ech.filter(e=>e.paye).reduce((s,e)=>s+(+e.montant||0),0);const done=db.rdv.filter(r=>r.contratId===c.id&&r.statut==='fait').length;return{tot,paid,done}}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
function openSheet(h){const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+h;s.classList.add('open');$('#sbg').classList.add('open');s.scrollTop=0;document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('open');$('#sbg').classList.remove('open');document.body.style.overflow=''}
function dl(name,content,type){const b=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* champs de formulaire */
const F=(id,lab,v='',type='text',extra='')=>`<label>${lab}</label><input id="f_${id}" type="${type}" value="${esc(v)}" ${extra}>`;
const T=(id,lab,v='',ph='')=>`<label>${lab}</label><textarea id="f_${id}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const S=(id,lab,opts,v,extra='')=>`<label>${lab}</label><select id="f_${id}" ${extra}>${opts.map(o=>{const[k,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(k)}" ${String(k)===String(v??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const V=id=>{const e=$('#f_'+id);return e?e.value.trim():''};
const noteB=(l,t)=>t?`<div class="note"><b>${l}</b>${esc(t)}</div>`:'';

/* ============ NAVIGATION ============ */
function go(t,id){state.tab=t;state.benef=id||null;render();window.scrollTo(0,0)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.tab));
 let h='';
 if(state.tab==='home')h=viewHome();
 else if(state.tab==='benef')h=state.benef?viewBenefDetail(state.benef):viewBenefs();
 else if(state.tab==='rdv')h=viewRdv();
 else if(state.tab==='contrats')h=viewContrats();
 else h=viewPlus();
 $('#main').innerHTML=h;
 $('#fab').style.display=state.tab==='plus'?'none':'block';
 if(state.tab==='benef'&&!state.benef)renderBList();
}
function fab(){
 if(state.tab==='benef')return state.benef?formRdv(null,{benefId:state.benef}):formBenef();
 if(state.tab==='rdv')return formRdv();
 if(state.tab==='contrats')return formContrat();
 openSheet(`<h3>Ajouter</h3><div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="formRdv()">📅 Nouveau RDV</button>
 <button class="btn" onclick="formBenef()">👤 Nouveau bénéficiaire</button>
 <button class="btn" onclick="formContrat()">📄 Nouveau contrat</button>
 <button class="btn" onclick="closeSheet();pickDocs(null)">📎 Importer des fiches bénéficiaires</button></div>`);
}

/* ============ ACCUEIL ============ */
function alerts(){
 const t=todayStr(),now=new Date(),out=[];
 const A=(txt,sub,act,bad)=>out.push(`<div class="card tap alert ${bad?'bad':''}" onclick="${act}"><div class="t">${txt}</div><div class="m">${sub}</div></div>`);
 relances().forEach(x=>A('💼 '+RTIT[x.kind]+' : '+esc(fullName(x.b)),x.sub,`relanceSheet('${x.b.id}','${x.kind}')`));
 db.benef.filter(b=>b.statut==='actif').forEach(b=>(b.objs||[]).forEach(o=>{if(o.statut==='encours'&&o.echeance&&o.echeance<t)A('🎯 Faire le point sur un objectif : '+esc(fullName(b)),esc(o.txt)+' · échéance '+fDate(o.echeance),`formObj('${b.id}','${o.id}')`)}));
 db.rdv.filter(r=>r.statut==='prevu'&&new Date(rdvDate(r).getTime()+(+r.duree||60)*60000)<now).sort(byDate)
  .forEach(r=>A('✎ Clôturer & noter : '+esc(bName(r.benefId)),fRdv(r)+' · '+esc(r.type),`openRdv('${r.id}')`));
 db.rdv.filter(r=>r.statut==='fait'&&!r.cr).sort(byDate)
  .forEach(r=>A('✎ Compte rendu manquant : '+esc(bName(r.benefId)),fRdv(r),`openRdv('${r.id}')`));
 db.contrats.forEach(c=>{
  if(c.statut==='resilie')return;
  (c.ech||[]).forEach(e=>{if(!e.paye&&e.date&&e.date<=t)A('💶 Paiement attendu : '+esc(bName(c.benefId)),eur(e.montant)+' · échéance '+fDate(e.date)+' · '+esc(shortOffre(c.offre)),`openContrat('${c.id}')`,true)});
  if(c.statut!=='encours')return;
  if(c.fin&&c.fin<t)A('⏳ Contrat échu à clôturer : '+esc(bName(c.benefId)),esc(shortOffre(c.offre))+' · fin '+fDate(c.fin),`openContrat('${c.id}')`,true);
  else if(c.fin&&c.fin<=addDays(t,14))A('⏳ Contrat bientôt terminé : '+esc(bName(c.benefId)),esc(shortOffre(c.offre))+' · fin '+fDate(c.fin)+' → prévoir renouvellement',`openContrat('${c.id}')`);
  const{done}=cTotals(c);if(+c.seances&&done>=+c.seances)A('🔁 Séances épuisées : '+esc(bName(c.benefId)),done+'/'+c.seances+' séances · '+esc(shortOffre(c.offre)),`openContrat('${c.id}')`);
 });
 db.benef.filter(b=>b.statut==='actif'&&!nextRdv(b.id)).forEach(b=>A('📅 Aucun prochain RDV : '+esc(fullName(b)),'Appuie pour programmer',`formRdv(null,{benefId:'${b.id}'})`));
 return out;
}
function viewHome(){
 const t=todayStr(),in7=addDays(t,7);
 if(!db.benef.length)return `<div class="card hello"><div class="t" style="color:var(--gold2)">Bienvenue dans ton suivi Y.E.S.I</div><div class="m" style="margin-top:6px">1. Ajoute un bénéficiaire<br>2. Crée son contrat (offre, échéancier)<br>3. Programme ses RDV et note le compte rendu après chaque séance</div><div class="btns"><button class="btn gold" onclick="formBenef()">+ Premier bénéficiaire</button><button class="btn" onclick="pickDocs(null)">📎 Importer des fiches</button><button class="btn" onclick="go('plus')">Importer une sauvegarde</button></div></div>`;
 const actifs=db.benef.filter(b=>b.statut==='actif').length;
 const ctr=db.contrats.filter(c=>c.statut==='encours').length;
 const sem=db.rdv.filter(r=>r.statut==='prevu'&&r.date>=t&&r.date<=in7).length;
 let du=0;db.contrats.forEach(c=>{if(c.statut!=='resilie')(c.ech||[]).forEach(e=>{if(!e.paye)du+=+e.montant||0})});
 const today=db.rdv.filter(r=>r.date===t&&r.statut!=='annule').sort(byDate);
 const next=db.rdv.filter(r=>r.statut==='prevu'&&r.date>t&&r.date<=in7).sort(byDate);
 const al=alerts();
 const le=lsGet(KEY+'_lastExport');

/* ============ RDV ============ */
function rdvCard(r,name=true){
 const[l,cl]=RSTAT[r.statut]||RSTAT.prevu;
 return `<div class="card tap" onclick="openRdv('${r.id}')"><div class="row"><div><div class="t">${name?esc(bName(r.benefId)):fRdv(r)}</div><div class="m">${name?fRdv(r)+' · ':''}${esc(r.type)} · ${esc(r.lieu||'')}${r.protocole?' · '+esc(r.protocole):''}</div></div><span class="badge ${cl}">${l}</span></div>
 ${r.objectif&&r.statut==='prevu'?`<div class="m" style="margin-top:6px">🎯 ${esc(r.objectif)}</div>`:''}
 ${r.statut==='fait'&&!r.cr?'<div class="m" style="color:var(--warn);margin-top:6px">✎ Compte rendu à écrire</div>':''}</div>`;
}
function viewRdv(){
 const f=state.rdvFilter,t=todayStr();let l=db.rdv.slice();
 if(f==='avenir')l=l.filter(r=>r.date>=t&&r.statut==='prevu').sort(byDate);
 else if(f==='passes')l=l.filter(r=>!(r.date>=t&&r.statut==='prevu')).sort((a,b)=>rdvDate(b)-rdvDate(a));
 else l.sort((a,b)=>rdvDate(b)-rdvDate(a));
 let h='',last='';
 l.forEach(r=>{if(r.date!==last){h+=`<div class="m" style="margin:14px 0 6px;color:var(--gold);font-weight:600">${fDate(r.date)}${r.date===t?' — aujourd’hui':''}</div>`;last=r.date}h+=rdvCard(r)});
 const seg=`<div class="seg">${[['semaine','Semaine'],['avenir','À venir'],['passes','Passés'],['tous','Tous']].map(([k,lb])=>`<button class="${f===k?'on':''}" onclick="state.rdvFilter='${k}';render()">${lb}</button>`).join('')}</div>`;
 if(f==='semaine')return `<h2>Rendez-vous</h2>${seg}${viewWeek()}`;
 return `<h2>Rendez-vous</h2><div class="seg">${[['semaine','Semaine'],['avenir','À venir'],['passes','Passés'],['tous','Tous']].map(([k,lb])=>`<button class="${f===k?'on':''}" onclick="state.rdvFilter='${k}';render()">${lb}</button>`).join('')}</div>${h||'<div class="empty">Aucun RDV</div>'}`;
}

 const bs=db.benef.filter(b=>b.statut!=='termine'||b.id===r.benefId).sort((a,b)=>(a.prenom||'').localeCompare(b.prenom||''));
 if(!r.benefId&&bs[0])r.benefId=bs[0].id;
 openSheet(`<h3>${id?'Modifier le RDV':'Programmer un RDV'}</h3>
 ${S('benefId','Bénéficiaire',bs.map(b=>[b.id,fullName(b)]),r.benefId,'onchange="refreshContratSel()"')}
 <div class="g2"><div>${F('date','Date',r.date,'date')}</div><div>${F('heure','Heure',r.heure,'time')}</div></div>

 <div class="btns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn gold" onclick="saveRdv('${id||''}')">${id?'Enregistrer':'Programmer'}</button></div>`);
 refreshContratSel(r.contratId);

 ['cr','cles','devoirs','axe','objNext'].forEach(k=>r[k]=V(k));

 const rg=$('#f_ressenti');if(rg&&(rg.dataset.t||r.ressenti))r.ressenti=rg.value;
 r.statut=_rs;save();render();return r;

function saveCR(id,next){
 const r=persistCR(id);if(!r)return;
 if(!next){closeSheet();toast('Compte rendu enregistré');return}
 const base=r.date<todayStr()?todayStr():r.date;

function contratCard(c,name=true){
 const{tot,paid,done}=cTotals(c),[l,cl]=CSTAT[c.statut]||CSTAT.encours;
 return `<div class="card tap" onclick="openContrat('${c.id}')"><div class="row"><div><div class="t">${name?esc(bName(c.benefId)):esc(shortOffre(c.offre))}</div><div class="m">${name?esc(shortOffre(c.offre))+' · ':''}${fDate(c.debut)} → ${fDate(c.fin)}</div></div><span class="badge ${cl}">${l}</span></div>
 <div class="m" style="margin-top:6px">Séances ${done}${+c.seances?'/'+esc(c.seances):''} · Payé ${eur(paid)} / ${eur(tot)}</div>
 ${+c.seances?`<div class="bar"><i style="width:${Math.min(100,done/c.seances*100)}%"></i></div>`:''}</div>`;

/* ============ PROGRESSION (historique des mesures) ============ */
const SKEYS=['y','e','s','i','dips','sota','qfac'];
const ALLSC=[...AXES,...PROTO3];
const PAL_D=['#e6c878','#7aa7d9','#6fbf73','#e07a5f'],PAL_L=['#b08a35','#2f6db5','#2e8b57','#c4513a'];
const numOr=v=>v===''||v==null||isNaN(+v)?null:+v;
const fmtN=n=>String(Math.round(n*10)/10).replace('.',',');
const byD=(a,c)=>(a.date||'').localeCompare(c.date||'');
function ensureHist(b){
 if(!Array.isArray(b.hist))b.hist=[];
 if(!b.hist.length&&(SKEYS.some(k=>numOr(b[k])!=null)||numOr(b.scoreBilan)!=null)){
  const h={id:uid(),date:b.auditDate||b.cree||todayStr(),src:'Initial'};SKEYS.forEach(k=>h[k]=numOr(b[k]));h.bilan=numOr(b.scoreBilan);h.proto=numOr(b.scoreProto);b.hist.push(h);
 }
 return b.hist;
}
function syncCurrent(b){
 const h=ensureHist(b).sort(byD);if(!h.length)return;
 const lastOf=k=>{for(let i=h.length-1;i>=0;i--)if(h[i][k]!=null)return String(h[i][k]);return''};
 SKEYS.forEach(k=>b[k]=lastOf(k));b.scoreBilan=lastOf('bilan');b.scoreProto=lastOf('proto');b.auditDate=h[h.length-1].date;
}
function addMesure(b,m){
 ensureHist(b);const ex=b.hist.find(h=>h.date===m.date&&h.src===m.src);
 if(ex)Object.assign(ex,m,{id:ex.id});else b.hist.push(Object.assign({id:uid()},m));
 syncCurrent(b);
}
function progRows(b){
 const h=ensureHist(b).slice().sort(byD);
 return [...ALLSC.map(a=>({l:a.l,k:a.k,u:'/10'})),{l:'Bilan global',k:'bilan',u:' %'},{l:'Score protocoles',k:'proto',u:'/10'}].map(a=>{
  const pts=h.filter(x=>x[a.k]!=null);if(!pts.length)return null;
  const f=pts[0][a.k],l=pts[pts.length-1][a.k];return{l:a.l,k:a.k,u:a.u,first:f,last:l,d:Math.round((l-f)*10)/10,n:pts.length};
 }).filter(Boolean);
}
function lineChart(series,opt={}){
 const W=340,H=170,P={l:26,r:12,t:10,b:24},max=opt.max||10,dark=opt.dark!==false;
 const dates=[...new Set(series.flatMap(s=>s.pts.map(p=>p[0])))].sort();if(!dates.length)return'';
 const tm=d=>new Date(d+'T12:00').getTime(),t0=tm(dates[0]),span=Math.max(1,tm(dates[dates.length-1])-t0);
 const X=d=>dates.length===1?(P.l+(W-P.l-P.r)/2):P.l+(tm(d)-t0)/span*(W-P.l-P.r);
 const Y=v=>P.t+(1-Math.min(max,Math.max(0,v))/max)*(H-P.t-P.b);
 const grid=dark?'#2e2a1e':'#eee5d0',txt=dark?'#9c927c':'#7a705c',bg=dark?'#17150f':'#fff';
 let g='';[0,max/2,max].forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}"/><text x="${P.l-6}" y="${Y(v)+4}" fill="${txt}" font-size="10" text-anchor="end">${v}</text>`});
 const ticks=dates.length<=4?dates:[dates[0],dates[Math.floor(dates.length/2)],dates[dates.length-1]];
 ticks.forEach(d=>{const an=dates.length===1?'middle':d===dates[0]?'start':d===dates[dates.length-1]?'end':'middle';g+=`<text x="${X(d)}" y="${H-6}" fill="${txt}" font-size="10" text-anchor="${an}">${d.slice(8,10)}/${d.slice(5,7)}</text>`});
 let ln='';series.forEach(s=>{if(!s.pts.length)return;const p=s.pts.slice().sort((a,b)=>a[0].localeCompare(b[0]));
  if(p.length>1)ln+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ')}"/>`;
  ln+=p.map(q=>`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3.5" fill="${s.c}" stroke="${bg}" stroke-width="1.5"><title>${esc(s.l)} : ${fmtN(q[1])} — ${fDate(q[0])}</title></circle>`).join('')});
 const leg=series.filter(s=>s.pts.length).map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap"><i style="width:12px;height:3px;border-radius:2px;background:${s.c};display:inline-block"></i>${esc(s.l)}</span>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${g}${ln}</svg><div style="font-size:11px;color:${txt};margin-top:6px;line-height:1.9">${leg}</div>`;
}
const chartOf=(L,h,pal,dark)=>{const s=L.map((a,i)=>({l:a.l,c:pal[i],pts:h.filter(x=>x[a.k]!=null).map(x=>[x.date,x[a.k]])}));return s.some(x=>x.pts.length>1)?lineChart(s,{dark}):''};
function diagBlock(b){

 let o=`<h2>Diagnostic & progression</h2>`;

  const c1=chartOf(AXES,h,PAL_D,true),c2=chartOf(PROTO3,h,PAL_D,true);
  if(c1)o+=`<div class="card" style="margin-top:10px"><div class="m" style="margin-bottom:6px">Axes Y.E.S.I (/10)</div>${c1}</div>`;

 }
 if(res.length>1)o+=`<div class="card" style="margin-top:10px"><div class="m" style="margin-bottom:6px">Ressenti des séances (/10) · moyenne ${fmtN(res.reduce((s,x)=>s+x[1],0)/res.length)}</div>${lineChart([{l:'Ressenti séance',c:PAL_D[0],pts:res}])}</div>`;
 if(h.length)o+=`<details style="margin-top:6px"><summary class="m" style="cursor:pointer;padding:8px 0;color:var(--gold2)">▸ Historique des mesures (${h.length})</summary>${h.slice().reverse().map(x=>`<div class="card tap" onclick="formMesure('${b.id}','${x.id}')"><div class="row"><div class="t">${fDate(x.date)}</div><span class="badge">${esc(x.src||'')}</span></div><div class="m">${[...ALLSC.filter(a=>x[a.k]!=null).map(a=>a.l.split(' ')[0]+' '+fmtN(x[a.k])),x.bilan!=null&&'Bilan '+fmtN(x.bilan)+' %',x.proto!=null&&'Proto '+fmtN(x.proto)].filter(Boolean).join(' · ')}</div></div>`).join('')}</details>`;
 return o+`<button class="btn sm" style="width:100%;margin-top:6px" onclick="formMesure('${b.id}')">＋ Nouvelle mesure (bilan, re-bilan, point d’étape)</button>`;
}

const RTIT={accomp:'Proposer l’accompagnement',renouv:'Proposer le renouvellement',prospect:'Relancer le prospect'};
const RLAB={accomp:'Proposition accompagnement',renouv:'Proposition renouvellement',prospect:'Relance prospect'};
const isBilanOffre=o=>/^(Bilan Mental|Diagnostic)/i.test(o||'');
function relances(){
 const t=todayStr(),out=[];
 db.benef.forEach(b=>{
  if(b.noRelance||b.statut==='termine'||b.statut==='pause')return;
  if(b.relanceSnooze&&t<b.relanceSnooze)return;
  const cs=db.contrats.filter(c=>c.benefId===b.id&&c.statut!=='resilie'),acc=cs.filter(c=>!isBilanOffre(c.offre));
  const rs=db.rdv.filter(r=>r.benefId===b.id),fut=rs.some(r=>r.statut==='prevu'&&r.date>=t);
  const bil=[...rs.filter(r=>r.statut==='fait'&&/bilan/i.test(r.type)).map(r=>r.date),...cs.filter(c=>isBilanOffre(c.offre)).map(c=>c.debut),...ensureHist(b).map(h=>h.date)].filter(d=>d&&d<=t).sort().pop();
  if(!acc.length&&bil){if(t>=addDays(bil,7))out.push({b,kind:'accomp',sub:'Bilan du '+fDate(bil)+' · pas encore d’accompagnement'});return}
  if(acc.length&&!acc.some(c=>c.statut==='encours'||c.statut==='attente')){const last=acc.map(c=>c.fin||c.debut).filter(Boolean).sort().pop();out.push({b,kind:'renouv',sub:'Programme terminé'+(last?' le '+fDate(last):'')+' · aucun contrat en cours'});return}
  if(b.statut==='prospect'&&!fut&&!acc.length){const last=[b.cree,...rs.map(r=>r.date),...(b.relances||[]).map(x=>x.date)].filter(Boolean).sort().pop();if(!last||t>=addDays(last,7))out.push({b,kind:'prospect',sub:'Dernier contact : '+(last?fDate(last):'—')})}
 });
 return out;
}

function viewWeek(){
 const t=todayStr(),base=new Date(t+'T12:00');base.setDate(base.getDate()-((base.getDay()+6)%7)+7*state.wk);
 const days=[...Array(7)].map((_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return ymd(d)});
 const MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],lab=d=>{const x=new Date(d+'T12:00');return x.getDate()+' '+MO[x.getMonth()]};
 const nb=db.rdv.filter(r=>r.date>=days[0]&&r.date<=days[6]&&r.statut!=='annule').length;
 let h=`<div class="row" style="align-items:center;margin-bottom:10px"><button class="btn sm" onclick="state.wk--;render()">‹</button><div style="text-align:center"><div class="t">${lab(days[0])} – ${lab(days[6])}</div><div class="m">${nb} RDV${state.wk?` · <a href="#" onclick="state.wk=0;render();return false">cette semaine</a>`:''}</div></div><button class="btn sm" onclick="state.wk++;render()">›</button></div>`;
 days.forEach(d=>{const l=db.rdv.filter(r=>r.date===d&&r.statut!=='annule').sort(byDate);
  h+=`<div class="wday${d===t?' today':''}"><div class="wd-h" onclick="formRdv(null,{date:'${d}'})"><span>${fDate(d).split(' ')[0]} <b>${new Date(d+'T12:00').getDate()}</b>${d===t?' · aujourd’hui':''}</span><span>${l.length?l.length+' RDV · ':''}＋</span></div>${l.map(r=>{const[sl,sc]=RSTAT[r.statut]||RSTAT.prevu;return `<div class="wrdv" onclick="openRdv('${r.id}')"><b>${r.heure?r.heure.replace(':','h'):'—'}</b><div style="flex:1;min-width:0"><div class="t" style="font-size:14px">${esc(bName(r.benefId))}</div><div class="m">${esc(r.type)}${r.protocole?' · '+esc(r.protocole):''}</div></div><span class="badge ${sc}">${sl}</span></div>`}).join('')}</div>`});
 return h;
}

/* ============ CODE D'ACCÈS ============ */
const PINK=KEY+'_pin';
let _pinBuf='',_pinMode=null,_pinFirst='',_hiddenAt=0;
async function hashPin(p){const s='yesi|'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'f'+h}}
function lockScreen(mode){
 _pinMode=mode;_pinBuf='';$('#lock').style.display='flex';
 $('#lockMsg').textContent=mode==='unlock'?'Code d’accès':mode==='set'?'Choisis un code à 4 chiffres':'Confirme le code';
 $('#lockCancel').style.display=mode==='unlock'?'none':'inline-block';$('#lockForgot').style.display=mode==='unlock'?'inline-block':'none';
 pinDots();
}
function pinDots(){$('#lockDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<_pinBuf.length?'on':''}"></i>`).join('')}
function unlockUI(){$('#lock').style.display='none';document.body.classList.remove('locked')}
async function pinKey(k){
 if(k==='del'){_pinBuf=_pinBuf.slice(0,-1);return pinDots()}
 if(_pinBuf.length>=4)return;_pinBuf+=k;pinDots();if(_pinBuf.length<4)return;
 const v=_pinBuf;
 if(_pinMode==='unlock'){if(await hashPin(v)===lsGet(PINK))unlockUI();else pinErr('Code incorrect')}
 else if(_pinMode==='set'){_pinFirst=v;setTimeout(()=>lockScreen('confirm'),150)}
 else if(v===_pinFirst){lsSet(PINK,await hashPin(v));unlockUI();render();toast('Code activé 🔒')}
 else{pinErr('Les codes ne correspondent pas');setTimeout(()=>lockScreen('set'),900)}
}
function pinErr(m){$('#lockMsg').textContent=m;const d=$('#lockDots');d.classList.add('shake');setTimeout(()=>{d.classList.remove('shake');_pinBuf='';pinDots()},450)}
function lockCancel(){if(_pinMode!=='unlock')unlockUI()}
function lockNow(){closeSheet();document.body.classList.add('locked');lockScreen('unlock')}
function pinOff(){if(!confirm('Retirer le code d’accès ?'))return;try{localStorage.removeItem(PINK)}catch(e){}render();toast('Code retiré')}
async function pinForgot(){
 if(!confirm('Sans le code, les données de ce téléphone restent inaccessibles.\n\nTu peux tout effacer, puis restaurer ta dernière sauvegarde (Plus → Importer).\n\nEffacer les données de ce téléphone ?'))return;
 if(!confirm('Confirmer l’effacement définitif ?'))return;
 try{localStorage.removeItem(KEY);localStorage.removeItem(PINK)}catch(e){}try{await docClear()}catch(e){}location.reload();
}

 const s=ST(),pin=!!lsGet(PINK);
 return `<h2>Code d’accès</h2><div class="card"><div class="m">${pin?'🔒 Code activé : demandé à l’ouverture et après 2 min hors de l’appli.':'Protège l’accès à tes notes avec un code à 4 chiffres.'}</div><div class="btns">${pin?`<button class="btn" onclick="lockScreen('set')">Modifier</button><button class="btn" onclick="lockNow()">Verrouiller</button><button class="btn bad" onclick="pinOff()">Retirer</button>`:`<button class="btn gold" onclick="lockScreen('set')">🔒 Activer un code</button>`}</div></div>
 <h2>Infos pour les reçus</h2><div class="card">
 ${F('s_nom','Nom commercial',s.nom)}${F('s_resp','Ton nom (signataire)',s.resp)}${T('s_adresse','Adresse',s.adresse)}

 <div class="btns"><button class="btn gold" onclick="saveST()">Enregistrer</button></div></div>`;
}
function saveST(){const s=ST();['nom','resp','adresse','siret','tel','email','mention'].forEach(k=>s[k]=V('s_'+k));save();toast('Infos enregistrées')}

/* ============ EXPORT DOCUMENTS PDF / HTML ============ */
function docWrap(title,sub,body){
 return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>
@page{size:A4;margin:14mm}

.page{max-width:800px;margin:0 auto;background:#fff;padding:28px 24px 80px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px solid #c9a24a;padding-bottom:12px;margin-bottom:18px}

h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#b08a35;border-bottom:1px solid #e8dcc0;padding-bottom:4px;margin:20px 0 10px;break-after:avoid}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid #eee5d0;text-align:left;vertical-align:top}
th{background:#f6f1e6;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#7a705c}
tr{break-inside:avoid}
.kv td:first-child{width:38%;color:#7a705c}
.box{border:1px solid #e8dcc0;border-radius:8px;padding:10px 12px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
.box .t{font-weight:700}.m{color:#7a705c;font-size:12px}
.n{white-space:pre-wrap;margin-top:7px}.n b{display:block;font-size:10px;letter-spacing:.8px;color:#b08a35}
.axes{display:flex;gap:8px}.axes div{flex:1;text-align:center;border:1px solid #e8dcc0;border-radius:8px;padding:8px 4px}
.axes b{display:block;font-size:20px;color:#b08a35}.axes span{font-size:10px;color:#7a705c}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid #c9a24a;color:#8a6a22;font-weight:600}
.ft{margin-top:26px;border-top:1px solid #e8dcc0;padding-top:8px;color:#9a907a;font-size:10px;text-align:center}
.pbtn{position:fixed;right:14px;bottom:14px;background:#c9a24a;color:#1a1408;border:0;border-radius:24px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media print{body{background:#fff}.page{padding:0;max-width:none}.pbtn{display:none}}
</style></head><body><div class="page">
<div class="hd"><div><div class="logo">Y.E.S.I <span>CONCEPT</span></div><small>Yes Attitude · Estime de soi · Smart Goals · Investissement</small></div><small>Édité le ${fDate(todayStr())}</small></div>
<h1>${esc(title)}</h1><div class="sub">${sub}</div>${body}
<div class="ft">Y.E.S.I CONCEPT — Document confidentiel — yesiconcept.rdv@gmail.com</div></div>
<button class="pbtn" onclick="window.print()">⬇ Enregistrer en PDF</button></body></html>`;
}
const kv=rows=>`<table class="kv">${rows.filter(r=>r[1]).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
const nb=(l,t)=>t?`<div class="n"><b>${l}</b>${esc(t)}</div>`:'';
function crBox(r,showName,share){
 const[l]=RSTAT[r.statut]||RSTAT.prevu;
 const meta=[r.lieu,r.protocole,r.axe&&'Axe : '+r.axe,!share&&r.ressenti&&'Ressenti '+r.ressenti+'/10'].filter(Boolean).join(' · ');
 return `<div class="box"><div class="t">${showName?esc(bName(r.benefId))+' — ':''}${fRdv(r)} · ${esc(r.type)} <span class="badge">${l}</span></div>${meta?`<div class="m">${esc(meta)}</div>`:''}
 ${nb('OBJECTIF DE LA SÉANCE',r.objectif)}${share?'':trameTxt(r).map(([l,t])=>nb(esc(l).toUpperCase(),t||'—')).join('')+nb('CE QUI S’EST DIT',r.cr)+nb('POINTS CLÉS / PRISES DE CONSCIENCE',r.cles)}${nb('TRAVAIL À FAIRE',r.devoirs)}${nb('OBJECTIF DU PROCHAIN RDV',r.objNext)}</div>`;
}
function ctrBox(c){
 const{tot,paid,done}=cTotals(c),[l]=CSTAT[c.statut]||CSTAT.encours;
 return `<div class="box"><div class="t">${esc(c.offre)} <span class="badge">${l}</span></div><div class="m">${c.detail?esc(c.detail)+' · ':''}Du ${fDate(c.debut)} au ${fDate(c.fin)} · Séances ${done}${+c.seances?' / '+esc(c.seances):''} · Payé ${eur(paid)} / ${eur(tot)}</div>
 ${(c.ech||[]).length?`<table style="margin-top:6px"><tr><th>Échéance</th><th>Montant</th><th>Statut</th></tr>${c.ech.map(e=>`<tr><td>${fDate(e.date)}</td><td>${eur(e.montant)}</td><td>${e.paye?'Payé':'En attente'}</td></tr>`).join('')}</table>`:''}${nb('NOTES / CONDITIONS',c.notes)}</div>`;
}
function docBenef(id,share){
 const b=db.benef.find(x=>x.id===id),t=todayStr();
 const rs=db.rdv.filter(r=>r.benefId===id).sort(byDate);
 const done=rs.filter(r=>r.statut==='fait'),fut=rs.filter(r=>r.statut==='prevu'&&r.date>=t);
 const hist=rs.filter(r=>!fut.includes(r)&&r.statut!=='annule');
 const res=done.filter(r=>r.ressenti).map(r=>+r.ressenti);
 const cs=db.contrats.filter(c=>c.benefId===id);
 const hasAx=AXES.some(a=>b[a.k]!==''&&b[a.k]!=null);
 let body=`<h2>Identité</h2>${kv([['Statut',(BSTAT[b.statut]||BSTAT.actif)[0]],['Domaine',esc(b.domaine)],['Âge / catégorie',esc(b.categorie)],['Poste / rôle',esc(b.poste)],['Club / établissement',esc(b.club)],
  ...(share?[]:[['Téléphone',esc(b.tel)],['Email',esc(b.email)],['Parent / référent',esc([b.parent,b.parentTel,b.parentEmail].filter(Boolean).join(' · '))],['Origine',esc(b.source)]]),['Suivi depuis',b.cree?fDate(b.cree):'']])}`;
 if(b.objectifs)body+=`<h2>Demande de départ</h2><div class="box"><div class="n" style="margin:0">${esc(b.objectifs)}</div></div>`;
 body+=progDoc(b,share)+objDoc(b);
 body+=`<h2>Synthèse du suivi</h2>${kv([['Séances réalisées',String(done.length)],['Absences',String(rs.filter(r=>r.statut==='absent').length)],...(share?[]:[['Ressenti moyen',res.length?(res.reduce((a,c)=>a+c,0)/res.length).toFixed(1)+' / 10':'']]),['Prochain RDV',fut[0]?fRdv(fut[0]):'—']])}`;
 if(!share&&cs.length)body+=`<h2>Contrats</h2>${cs.map(ctrBox).join('')}`;
 body+=`<h2>${share?'Séances':'Historique & comptes rendus'}</h2>${hist.length?hist.map(r=>crBox(r,false,share)).join(''):'<div class="m">Aucune séance</div>'}`;
 if(!share&&b.notes)body+=`<h2>Notes générales</h2><div class="box"><div class="n" style="margin:0">${esc(b.notes)}</div></div>`;
 return docWrap((share?'Bilan de suivi — ':'Dossier — ')+fullName(b),share?'Document de suivi à destination du bénéficiaire et de sa famille':'Dossier bénéficiaire complet — usage interne',body);
}
function docRdv(id,share){
 const r=db.rdv.find(x=>x.id===id),c=db.contrats.find(x=>x.id===r.contratId),n=nextRdv(r.benefId);
 let body=crBox(r,false,share);
 body+=`<h2>Suite</h2>${kv([['Prochain RDV',n&&n.id!==r.id?fRdv(n)+' · '+esc(n.type):'À programmer'],...(c&&!share?[['Contrat',esc(c.offre)+' · séances '+cTotals(c).done+(+c.seances?' / '+esc(c.seances):'')]]:[])])}`;
 return docWrap('Compte rendu — '+bName(r.benefId),fRdv(r)+' · '+esc(r.type),body);
}
function docContrat(id){
 const c=db.contrats.find(x=>x.id===id),b=db.benef.find(x=>x.id===c.benefId)||{};
 const rs=db.rdv.filter(r=>r.contratId===id).sort(byDate);
 let body=`<h2>Bénéficiaire</h2>${kv([['Nom',esc(fullName(b))],['Âge / catégorie',esc(b.categorie)],['Club / établissement',esc(b.club)],['Parent / référent',esc(b.parent)]])}<h2>Contrat</h2>${ctrBox(c)}`;
 body+=`<h2>Séances liées (${rs.length})</h2>${rs.length?`<table><tr><th>Date</th><th>Type</th><th>Statut</th></tr>${rs.map(r=>`<tr><td>${fRdv(r)}</td><td>${esc(r.type)}</td><td>${(RSTAT[r.statut]||RSTAT.prevu)[0]}</td></tr>`).join('')}</table>`:'<div class="m">Aucune séance liée</div>'}`;
 return docWrap('Contrat — '+fullName(b),esc(c.offre),body);
}
function docGlobal(){
 const t=todayStr(),act=db.benef.filter(b=>b.statut==='actif').sort((a,b)=>(a.prenom||'').localeCompare(b.prenom||''));
 const fut=db.rdv.filter(r=>r.statut==='prevu'&&r.date>=t).sort(byDate);
 const cs=db.contrats.filter(c=>c.statut==='encours');
 let enc=0,att=0;const late=[];
 db.contrats.filter(c=>c.statut!=='resilie').forEach(c=>(c.ech||[]).forEach(e=>{if(e.paye)enc+=+e.montant||0;else{att+=+e.montant||0;late.push({c,e})}}));
 late.sort((a,b)=>(a.e.date||'').localeCompare(b.e.date||''));
 let body=`<h2>Chiffres clés</h2>${kv([['Bénéficiaires actifs',String(act.length)],['Contrats en cours',String(cs.length)],['Séances réalisées (total)',String(db.rdv.filter(r=>r.statut==='fait').length)],['RDV à venir',String(fut.length)],['Encaissé',eur(enc)],['Reste à encaisser',eur(att)]])}`;
 body+=`<h2>Bénéficiaires actifs</h2>${act.length?`<table><tr><th>Nom</th><th>Profil</th><th>Prochain RDV</th><th>Contrat</th></tr>${act.map(b=>{const n=nextRdv(b.id),c=activeContrat(b.id);return`<tr><td>${esc(fullName(b))}</td><td>${esc([b.categorie,b.club].filter(Boolean).join(' · '))}</td><td>${n?fRdv(n):'—'}</td><td>${c?esc(shortOffre(c.offre)):'—'}</td></tr>`}).join('')}</table>`:'<div class="m">Aucun</div>'}`;
 body+=`<h2>RDV à venir</h2>${fut.length?`<table><tr><th>Date</th><th>Bénéficiaire</th><th>Type</th><th>Objectif</th></tr>${fut.map(r=>`<tr><td>${fRdv(r)}</td><td>${esc(bName(r.benefId))}</td><td>${esc(r.type)}</td><td>${esc(r.objectif||'')}</td></tr>`).join('')}</table>`:'<div class="m">Aucun</div>'}`;
 body+=`<h2>Contrats en cours</h2>${cs.length?`<table><tr><th>Bénéficiaire</th><th>Offre</th><th>Fin</th><th>Séances</th><th>Payé</th></tr>${cs.map(c=>{const x=cTotals(c);return`<tr><td>${esc(bName(c.benefId))}</td><td>${esc(shortOffre(c.offre))}</td><td>${fDate(c.fin)}</td><td>${x.done}${+c.seances?' / '+esc(c.seances):''}</td><td>${eur(x.paid)} / ${eur(x.tot)}</td></tr>`}).join('')}</table>`:'<div class="m">Aucun</div>'}`;
 body+=`<h2>Paiements en attente</h2>${late.length?`<table><tr><th>Échéance</th><th>Bénéficiaire</th><th>Offre</th><th>Montant</th></tr>${late.map(({c,e})=>`<tr><td>${fDate(e.date)}${e.date&&e.date<=t?' <span class="badge">en retard</span>':''}</td><td>${esc(bName(c.benefId))}</td><td>${esc(shortOffre(c.offre))}</td><td>${eur(e.montant)}</td></tr>`).join('')}</table>`:'<div class="m">Aucun</div>'}`;
 return docWrap('Rapport d’activité','Situation au '+fDate(t),body);
}
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
function exportDoc(kind,id,fmt,share){
 let html,name;
 if(kind==='benef'){html=docBenef(id,share);name=(share?'bilan-suivi-':'dossier-')+slug(bName(id))}
 else if(kind==='rdv'){const r=db.rdv.find(x=>x.id===id);html=docRdv(id,share);name='compte-rendu-'+slug(bName(r.benefId))+'-'+r.date+(share?'-parents':'')}
 else if(kind==='contrat'){const c=db.contrats.find(x=>x.id===id);html=docContrat(id);name='contrat-'+slug(bName(c.benefId))}
 else{html=docGlobal();name='rapport-activite-yesi-'+todayStr()}
 outDoc(html,name,fmt);
}
function outDoc(html,name,fmt){
 html=html.replace(/<title>[^<]*<\/title>/,'<title>'+name+'</title>');
 if(fmt==='html'){dl(name+'.html',html,'text/html');toast('Fichier HTML téléchargé');return}
 const w=window.open('','_blank');
 if(!w){dl(name+'.html',html,'text/html');toast('Ouvre le fichier puis « Enregistrer en PDF »');return}
 w.document.open();w.document.write(html);w.document.close();
 setTimeout(()=>{try{w.focus();w.print()}catch(e){}},600);
}
function openExport(kind,id){
 const lab=kind==='benef'?'Dossier de '+esc(bName(id)):kind==='rdv'?'Compte rendu de séance':kind==='contrat'?'Récapitulatif du contrat':'Rapport d’activité global';
 const two=kind==='benef'||kind==='rdv';
 const B=(fmt,share,txt,cls)=>`<button class="btn ${cls||''}" onclick="exportDoc('${kind}','${id}','${fmt}',${share?1:0})">${txt}</button>`;
 openSheet(`<h3>Exporter</h3><div class="m">${lab}</div>
 ${two?'<h2 style="margin-top:14px">Version complète (interne)</h2>':''}
 <div class="btns">${B('pdf',0,'📄 PDF','gold')}${B('html',0,'🌐 HTML')}</div>
 ${two?`<h2>Version parents / bénéficiaire</h2><div class="m">Sans « ce qui s’est dit », points clés${kind==='benef'?', contacts, contrats et notes':''} : uniquement le travail à faire et les objectifs.</div><div class="btns">${B('pdf',1,'📄 PDF','gold')}${B('html',1,'🌐 HTML')}</div>`:''}
 <div class="m" style="margin-top:16px">PDF : dans la fenêtre d’impression, choisis « Enregistrer en PDF ». Si rien ne s’ouvre, le fichier HTML est téléchargé : ouvre-le et touche « Enregistrer en PDF ».</div>
 <div class="btns"><button class="btn" onclick="closeSheet()">Fermer</button></div>`);
}

 const le=lsGet(KEY+'_lastExport');
 let enc=0;db.contrats.forEach(c=>(c.ech||[]).forEach(e=>{if(e.paye)enc+=+e.montant||0}));
 return `<h2>Sauvegarde</h2><div class="card"><div class="m">Les données sont enregistrées sur ce téléphone (navigateur). Exporte une sauvegarde chaque semaine et garde-la dans ton Drive / tes mails.</div>

 <h2>Fiches bénéficiaires</h2><div class="card"><div class="m">Importe tes analyses / bilans HTML (plusieurs à la fois) : le bénéficiaire est retrouvé par son nom — ou créé — et ses scores Y.E.S.I et protocoles sont repris. Fichiers stockés sur ce téléphone : ${DOCS.length}.</div><div class="btns"><button class="btn gold" onclick="pickDocs(null)">📎 Importer des fiches</button></div></div>

 <h2>Agenda</h2><div class="card"><div class="m">Envoie tous les RDV à venir dans l’agenda du téléphone (fichier .ics, rappel 1 h avant).</div><div class="btns"><button class="btn" onclick="icsAll()">📅 Exporter les RDV à venir</button></div></div>
 <h2>Statistiques</h2><div class="stats">
 <div class="stat"><b>${db.benef.length}</b><span>Bénéficiaires (total)</span></div>
 <div class="stat"><b>${db.rdv.filter(r=>r.statut==='fait').length}</b><span>Séances réalisées</span></div>
 <div class="stat"><b>${db.contrats.length}</b><span>Contrats (total)</span></div>
 <div class="stat"><b>${eur(enc)}</b><span>Total encaissé</span></div></div>
 ${plusExtra()}
 <h2>Zone sensible</h2><div class="card"><button class="btn bad" style="width:100%" onclick="resetAll()">Tout effacer</button></div>
 <div class="m" style="text-align:center;margin-top:20px">Y.E.S.I CONCEPT — Suivi Pro v6</div>`;
}
async function exportJSON(){let docs=[];try{docs=await docAll()||[]}catch(e){}
 dl('yesi-suivi-'+todayStr()+'.json',JSON.stringify({app:'yesi-suivi-pro',version:2,date:new Date().toISOString(),...db,docs}),'application/json');lsSet(KEY+'_lastExport',todayStr());render();toast('Sauvegarde exportée')}
function importJSON(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.benef))throw 0;
  if(!confirm(`Importer ${d.benef.length} bénéficiaires, ${(d.rdv||[]).length} RDV, ${(d.contrats||[]).length} contrats, ${(d.docs||[]).length} documents ?\nLes données actuelles seront remplacées.`))return;
  db={benef:d.benef,rdv:d.rdv||[],contrats:d.contrats||[],settings:d.settings||db.settings||{},seq:Math.max(d.seq||0,db.seq||0)};save();
  if(Array.isArray(d.docs)){try{await docClear();for(const x of d.docs)await docPut(x);DOCS=d.docs.map(({data,...m})=>m)}catch(e){toast('Documents non restaurés')}}
  go('home');toast('Import réussi');
 }catch(e){toast('Fichier invalide')}finally{inp.value=''}};
 rd.readAsText(f);
}
function resetAll(){if(!confirm('Effacer TOUTES les données ?'))return;if(!confirm('Vraiment ? Exporte une sauvegarde avant si besoin.'))return;db={benef:[],contrats:[],rdv:[],settings:db.settings||{},seq:db.seq||0};save();docClear().catch(()=>{});DOCS=[];go('home');toast('Données effacées')}

$('#hdate').textContent=fDate(todayStr());
try{db.benef.forEach(ensureHist);save()}catch(e){}
if(lsGet(PINK)){document.body.classList.add('locked');lockScreen('unlock')}
render();
loadDocs();
document.addEventListener('visibilitychange',()=>{if(document.hidden){_hiddenAt=Date.now();return}
 if(lsGet(PINK)&&_hiddenAt&&Date.now()-_hiddenAt>120000&&$('#lock').style.display!=='flex'){document.body.classList.add('locked');closeSheet();lockScreen('unlock')}});
</script>
